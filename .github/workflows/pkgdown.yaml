# Build the package website and publish it to GitHub Pages.
#
# DESCRIPTION points at https://yulab-smu.github.io/ggcircos/ and _pkgdown.yml
# describes the site, but nothing built it, so that URL answered 404. This is
# the standard r-lib workflow: build on every push to the default branch and on
# a version tag, then deploy to the `gh-pages` branch.
#
# One-time setup on GitHub: Settings -> Pages -> Source: "Deploy from a branch",
# branch `gh-pages`, folder `/ (root)`.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only the default branch and releases publish; pull requests build only,
    # so a doc typo in a PR is caught without touching the live site.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ggplot2 >= 4.0 is a hard requirement (spec section 1.4), and pkgdown
      # executes every example, so the dependency install has to match what
      # R-CMD-check uses.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # `exclude:` in _pkgdown.yml does not filter root-level markdown in this
      # pkgdown version (verified: listing CONDUCT.md there changed nothing),
      # and pkgdown renders every top-level .md it finds. AGENTS.md is internal
      # development notes, so it is dropped after the build instead.
      - name: Build site
        run: |
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
          unlink("docs/AGENTS.html")
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
